name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Go vet
        run: go vet ./cmd/

      - name: Go test
        run: go test -v -count=1 -race ./cmd/

      - name: Go build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/deploy-dashboard-static ./cmd/
          ls -lh /tmp/deploy-dashboard-static

      - name: Verify embedded UI is fresh
        run: |
          # The binary must carry the *current* web/index.html, not a stale
          # copy (guards against regressing to the old embed_gen.go / env-var
          # flow). Fails if the freshly-built binary does not contain a string
          # that is unique to the live UI.
          if ! strings /tmp/deploy-dashboard-static | grep -q "Devpod"; then
            echo "FAIL: built binary does not embed the current web/index.html"
            exit 1
          fi
          echo "OK: embedded UI matches web/index.html"

      - name: JS test
        run: node web/test.js
