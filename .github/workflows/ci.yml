name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Go vet
        run: go vet ./cmd/

      - name: Go test
        run: go test -v -count=1 -race ./cmd/

      - name: Go build
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o /tmp/deploy-dashboard-static ./cmd/
          ls -lh /tmp/deploy-dashboard-static

      - name: JS test
        run: node web/test.js
