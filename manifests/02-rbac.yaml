# ServiceAccount for the deploy-dashboard app
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
---
# ClusterRole: read pods/nodes/services/deployments/replicasets + logs,
# edit deployments, create/delete deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-dashboard
  labels:
    app.kubernetes.io/name: deploy-dashboard
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "services"]
  verbs: ["get", "list", "watch"]
# Pods: the "Terminate pods" action deletes individual pods (e.g. to restart
# a crashed container) without deleting the whole Deployment, so the
# ServiceAccount needs delete on pods in addition to read.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "delete"]
# Kubernetes Jobs for the Jobs tab (list + read; job pods are covered by the pods rule).
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
# Per-node CPU/memory usage for the Nodes tab. Only exposed if the metrics
# server (metrics.k8s.io) is installed; the app degrades to "—" otherwise.
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
# Bind the ClusterRole to the ServiceAccount in the apps namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-dashboard
  labels:
    app.kubernetes.io/name: deploy-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploy-dashboard
subjects:
- kind: ServiceAccount
  name: deploy-dashboard
  namespace: apps
---
# Namespace-scoped access to the SINGLE user-settings Secret (SSH key +
# tokens). The app only reads and writes this one named Secret, so grant just
# get + update + patch on that name -- no list over all secrets, no create.
# (SEC-02/SEC-03: credentials moved from a broad ConfigMap grant to a
# least-privilege, name-scoped Secret grant.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-dashboard-user-settings
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["user-settings"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-dashboard-user-settings
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-dashboard-user-settings
subjects:
- kind: ServiceAccount
  name: deploy-dashboard
  namespace: apps
