# RBAC for the deploy-dashboard app.
#
# Scope model (see docs/kubernetes-security-model.md):
#   - CLUSTER-scoped resources  -> read-only, in a ClusterRole (they are
#     cluster-wide by nature; the app only reads node/metrics data).
#   - NAMESPACED resources      -> feature-scoped verbs, in a namespace Role
#     bound only to `apps`. A Role's rules apply ONLY in its own namespace, so
#     the app can never touch another namespace's workloads. (A ClusterRole
#     would leak the same verbs to every namespace — do not use one for these.)
#
# The single ServiceAccount `deploy-dashboard` (ns `apps`) is the only subject.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
---
# ClusterRole: ONLY genuinely cluster-scoped resources, read-only.
# `nodes` (v1) for the Nodes tab names/roles/Ready; `nodes`
# (metrics.k8s.io) for the per-node CPU/RAM bars (degrades to "—" if the
# metrics server is absent). No write verbs — the app must never mutate
# cluster state.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-dashboard-cluster
  labels:
    app.kubernetes.io/name: deploy-dashboard
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-dashboard-cluster
  labels:
    app.kubernetes.io/name: deploy-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploy-dashboard-cluster
subjects:
- kind: ServiceAccount
  name: deploy-dashboard
  namespace: apps
---
# Role: ALL namespace-scoped resources, confined to `apps`. This is where the
# feature verbs live. Because it is a Role (not a ClusterRole), every rule
# below applies ONLY in the `apps` namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
rules:
# List/read pods + their logs. `delete` powers "Terminate pods" (force-restart
# a pod without deleting the Deployment).
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# Services: read-only metadata. No feature writes Services.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
# Deployments: the core CRUD surface. patch = scale (to 0 and back up, saving
# the prior count in an annotation), delete = delete deployment, create = headroom.
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# ReplicaSets: read + scale. update/patch are granted so the scale-down-to-zero
# / scale-back-up capability is never blocked by which object the scale path
# touches (scaling is normally done on the Deployment, which cascades to the
# ReplicaSet; the extra write keeps that capability robust).
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch", "update", "patch"]
# Jobs: list + view output. Read-only.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
# User settings (SSH key + access tokens): the SINGLE `user-settings` Secret,
# name-scoped via resourceNames. No list over all Secrets, no create.
# (SEC-02/SEC-03: credentials live in a Secret, least-privilege grant.)
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["user-settings"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-dashboard
subjects:
- kind: ServiceAccount
  name: deploy-dashboard
  namespace: apps
