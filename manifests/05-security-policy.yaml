# Enforce authentication on the dashboard at the ingress layer (closes SEC-01
# as WONT FIX in-app). This sits in front of the Gateway `eg` on the
# apps01.co.slakin.net listener and makes every request authenticate via the
# dex OIDC provider before reaching the deploy-dashboard Service.
#
# The app itself stays unauthenticated; identity is enforced here by the
# Envoy Gateway `SecurityPolicy` (OIDC + JWT). See issues/SEC-01.
#
# NOTE: the client secret below is a dev value (apps01devsecret) for the
# apps01-dev dex client. For anything beyond a lab, store a rotated secret in
# a dedicated K8s Secret and reference it via `clientIDRef` / `clientSecret`
# (the Secret must contain keys `client-id` and `client-secret`).
#
# --- 1. The dex client credentials (Opaque Secret) -----------------------
apiVersion: v1
kind: Secret
metadata:
  name: apps01-oidc-client
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
type: Opaque
stringData:
  client-id: apps01-dev
  client-secret: apps01devsecret
---
# --- 2. The SecurityPolicy: OIDC in front of the Gateway listener --------
#
# Targets the Gateway `eg` listener `http` in the `apps` namespace. The
# redirect URL is pinned to match the dex client's registered redirectURI
# (the default would be /oauth2/callback).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: apps01-oidc
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  # targetRefs (plural) replaces the deprecated singular targetRef, which is
  # removed in Envoy Gateway v1.11. Migrated during the v1.6.3 -> v1.10.0
  # upgrade. NO sectionName => the policy attaches to the ENTIRE Gateway, i.e.
  # BOTH the http (80) and https (443) listeners. Previously it was pinned to
  # `sectionName: http`, which left HTTPS (443) UNAUTHENTICATED -- a real
  # SEC-01 hole (anon users could hit https://apps01.../app/ directly and get
  # 200 with no login). Attaching to the whole Gateway closes that. Confirmed
  # after migration: oauth2 filter present on 5/5 routes for both listeners;
  # unauthenticated https /app/ and /app/api/* now 302 -> dex. Trade-off: the
  # '/' graceful status page (direct-response) is now also auth-gated (302),
  # which is fine -- it only showed a "starting up" hint and shouldn't leak
  # backend state to anonymous users anyway.
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: eg
  oidc:
    provider:
      # dex OpenID provider. Endpoints (authorization, token, end-session)
      # are auto-discovered from the well-known configuration:
      #   https://dex.co.slakin.net/auth/.well-known/openid-configuration
      # Must match the `issuer` value from dex's well-known config exactly
      # (https://dex.co.slakin.net/auth/.well-known/openid-configuration):
      #   "issuer": "https://dex.co.slakin.net/auth"
      issuer: https://dex.co.slakin.net/auth
    clientID: apps01-dev
    clientSecret:
      name: apps01-oidc-client
    # Must match a redirectURI registered on the dex client.
    redirectURL: http://apps01.co.slakin.net/callback
    scopes:
    - openid
    - email
    - profile
    # ⚠️ STILL BUGGY in v1.10.0 (CLUSTER-01 NOT fixed upstream): setting
    # `passThroughAuthHeader: true` reproduces the identical nil-pointer panic
    # at xds/translator/oidc.go:395 buildHeaderMatchers(0x0) on v1.10.0 (tested
    # 2026-11-11). handleWithCrashRecovery catches it, so the process survives
    # and last-good routes keep serving -- but the OIDC translation is dropped,
    # so the setting never takes effect AND it panics the xDS runner on every
    # reconcile. So it stays OMITTED. Trade-off unchanged: non-browser clients
    # cannot bypass the redirect flow with `Authorization: Bearer <token>`.
    # Do NOT re-enable without first confirming buildHeaderMatchers is nil-safe
    # in the running EG image. Track upstream; revisit on a newer release.
    # (Re-enabled + reverted during the v1.6.3 -> v1.10.0 upgrade; see
    #  issues/CLUSTER-01-envoy-503.md.)
    # Auto-refresh the id/access tokens when they expire.
    refreshToken: true
    # Clear credential cookies at /logout.
    logoutPath: /logout
