# Deploy the deploy-dashboard app
#
# The dashboard runs as a Deployment (not a raw Pod) so the platform keeps it
# alive: restart on crash, reschedule on node drain, and rolling updates.
#
# NOTE: This manifest uses a placeholder approach because the binary cannot be
# pushed to a registry from the sandbox environment. The image is
# debian:bookworm-slim and a static Go binary is injected into the shared
# emptyDir (see build-and-deploy.sh). For production, build and push the image
# using the Dockerfile and set `image:` to the pushed tag; the rest of the spec
# (probes, ports, volume) is unchanged.
#
# NOTE: The frontend (web/index.html) is compiled into the binary via Go
# //go:embed at build time -- no ConfigMap or EMBEDDED_HTML env var is needed
# to ship the UI (see APP-01).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deploy-dashboard
  strategy:
    # Recreate, not RollingUpdate: with an injected binary in an emptyDir there
    # is no image to roll, and a second replica would have no binary to start.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deploy-dashboard
    spec:
      serviceAccountName: deploy-dashboard
      # initContainer blocks until the static binary is injected into the
      # shared emptyDir, so the main container never starts against a missing
      # /app/deploy-dashboard. This is what makes the emptyDir wipe on
      # recreation safe (see APP-02 / build-and-deploy.sh).
      initContainers:
      - name: wait-for-binary
        image: debian:bookworm-slim
        command:
        - sh
        - -c
        - |
          echo "init: waiting for /app/deploy-dashboard to be injected..."
          while [ ! -f /app/deploy-dashboard ]; do
            sleep 3
          done
          echo "init: binary present, proceeding"
        volumeMounts:
        - name: app
          mountPath: /app
      containers:
      - name: dashboard
        image: debian:bookworm-slim
        command: ["sh", "-c"]
        args:
        - |
          echo "Starting deploy-dashboard..."
          exec /app/deploy-dashboard --listen=:8080 --namespace=apps
        volumeMounts:
        - name: app
          mountPath: /app
        ports:
        - containerPort: 8080
          name: http
        # The binary exposes /healthz (returns "ok"). Readiness gates Service
        # traffic; liveness restarts a wedged process (see APP-03).
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: app
        emptyDir: {}
---
# Service for the deploy-dashboard app
apiVersion: v1
kind: Service
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: deploy-dashboard
---
# Gateway: routes traffic for apps01.co.slakin.net to the dashboard
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: apps
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "apps01.co.slakin.net"
---
# HTTPRoute: routes apps01.co.slakin.net to the dashboard service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps01-route
  namespace: apps
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "apps01.co.slakin.net"
  rules:
  # Dashboard (default / catch-all)
  - backendRefs:
    - name: deploy-dashboard
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
  # echo-server demo
  - backendRefs:
    - name: echo-server
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /apps/echo
  # nginx demo
  - backendRefs:
    - name: nginx
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /apps/nginx
  # hello-world demo
  - backendRefs:
    - name: hello-world
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /apps/hello
---
# ReferenceGrant: allows the Envoy Gateway controller to reference
# the deploy-dashboard Service in the apps namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-envoy-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway-system
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
    name: deploy-dashboard
  - group: ""
    kind: Service
    name: echo-server
  - group: ""
    kind: Service
    name: nginx
  - group: ""
    kind: Service
    name: hello-world

