# Deploy the deploy-dashboard app
#
# The dashboard runs as a Deployment (not a raw Pod) so the platform keeps it
# alive: restart on crash, reschedule on node drain, and rolling updates.
#
# The binary (with the UI embedded via Go //go:embed) is baked into the image
# at build time (see Dockerfile + build-and-deploy.sh). No binary injection,
# no emptyDir, no initContainer -- a recreated pod is self-sufficient because
# its image already contains the binary.
#
# Image: registry.co.slakin.net/local/deploy-dashboard:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deploy-dashboard
  # RollingUpdate is fine now: the image carries the binary, so a new replica is
  # fully functional the moment it schedules (no injection step to wait on).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deploy-dashboard
    spec:
      serviceAccountName: deploy-dashboard
      containers:
      - name: dashboard
        image: registry.co.slakin.net/local/deploy-dashboard:latest
        imagePullPolicy: Always
        args:
        # The image ENTRYPOINT is `deploy-dashboard`; these are its flags.
        # --base-path=/app: the gateway serves the SPA under /app (the catch-all
        # / is the gateway-served 503 status page). This makes the SPA + its
        # relative api/* calls work under /app.
        - --listen=:8080
        - --namespace=apps
        - --base-path=/app
        ports:
        - containerPort: 8080
          name: http
        # The binary exposes /healthz (returns "ok"). Readiness gates Service
        # traffic; liveness restarts a wedged process (see APP-03).
        readinessProbe:
          httpGet:
            path: /app/healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /app/healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
---
# Service for the deploy-dashboard app
apiVersion: v1
kind: Service
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: deploy-dashboard
---
# Gateway: routes traffic for apps01.co.slakin.net to the dashboard
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: apps
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "apps01.co.slakin.net"
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "apps01.co.slakin.net"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: apps01-tls
---
# HTTPRoute: routes apps01.co.slakin.net to the dashboard service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps01-route
  namespace: apps
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "apps01.co.slakin.net"
  rules:
  # --- Real SPA + API: served by the Go backend under /app ---
  # The backend runs with --base-path=/app, so the SPA (index.html) and its
  # relative api/* calls + healthz all live under /app. This is what the browser
  # actually uses for the app.
  - backendRefs:
    - name: deploy-dashboard
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /app
  # --- Catch-all /: gateway-served status page (direct response), no backend ---
  # This is what the browser loads at the root (e.g. https://host/). Envoy serves
  # it directly, so it works even when the SPA backend is down/restarting (503).
  # The page polls /app/healthz every 3s and, once the backend is ready, reloads
  # the real SPA at /app/ in the background. While the backend is down the user
  # sees the dark "Starting up" dialog instead of a raw 503.
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.envoyproxy.io
        kind: HTTPRouteFilter
        name: devpod-status-page
    matches:
    - path:
        type: PathPrefix
        value: /
  # echo-server demo
  - backendRefs:
    - name: echo-server
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /apps/echo
  # ttyd terminal: serves natively at /apps/terminal/ via its -b flag; no URLRewrite needed.
  - backendRefs:
    - name: ttyd-terminal
      port: 7681
    matches:
    - path:
        type: PathPrefix
        value: /apps/terminal
  # VS Code Web: served under the /apps/vscode subpath. Code-server serves at its
  # own root and uses relative paths, so the gateway strips the /apps/vscode prefix
  # (URLRewrite ReplaceFullPath -> /) before it reaches code-server. The browser URL
  # stays /apps/vscode/... and the relative redirects resolve correctly.
  - backendRefs:
    - name: vscode-web
      port: 8080
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          # ReplacePrefixMatch: strip the matched /apps/vscode prefix, keep the
          # rest of the path (e.g. /apps/vscode/stable-x/out/foo.js -> /stable-x/out/foo.js).
          # ReplaceFullPath would clobber the sub-path, breaking code-server's assets.
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    matches:
    - path:
        type: PathPrefix
        value: /apps/vscode
---
# ReferenceGrant: allows the Envoy Gateway controller to reference
# the deploy-dashboard Service in the apps namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-envoy-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway-system
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
    name: deploy-dashboard
  - group: ""
    kind: Service
    name: echo-server
  - group: ""
    kind: Service
    name: ttyd-terminal
  - group: ""
    kind: Service
    name: vscode-web

