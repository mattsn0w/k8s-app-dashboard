# Deploy the deploy-dashboard app
#
# NOTE: This manifest uses a placeholder approach because the binary
# cannot be pushed to a registry from the sandbox environment.
#
# For production, build and push the image using the Dockerfile:
#   docker build -t registry.local/deploy-dashboard:latest .
#   docker push registry.local/deploy-dashboard:latest
#
# Then replace the pod spec below with a standard Deployment using
# the pushed image.
apiVersion: v1
kind: Pod
metadata:
  name: dashboard-runner
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  serviceAccountName: deploy-dashboard
  containers:
  - name: dashboard
    image: debian:bookworm-slim
    command: ["sh", "-c"]
    args:
    - |
      echo "Waiting for binary..."
      while [ ! -f /app/deploy-dashboard ]; do
        sleep 5
      done
      chmod +x /app/deploy-dashboard
      echo "Starting deploy-dashboard..."
      exec /app/deploy-dashboard --listen=:8080 --namespace=apps
    env:
    - name: EMBEDDED_HTML
      valueFrom:
        configMapKeyRef:
          name: dashboard-html
          key: index.html.b64
    volumeMounts:
    - name: app
      mountPath: /app
    ports:
    - containerPort: 8080
      name: http
  volumes:
  - name: app
    emptyDir: {}
  restartPolicy: Always
---
# Service for the deploy-dashboard app
apiVersion: v1
kind: Service
metadata:
  name: deploy-dashboard
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: deploy-dashboard
---
# Gateway: routes traffic for apps01.co.slakin.net to the dashboard
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: apps
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "apps01.co.slakin.net"
---
# HTTPRoute: routes apps01.co.slakin.net to the dashboard service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: apps01-route
  namespace: apps
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "apps01.co.slakin.net"
  rules:
  # Dashboard (default / catch-all)
  - backendRefs:
    - name: deploy-dashboard
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
  # echo-server demo
  - backendRefs:
    - name: echo-server
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /apps/echo
  # nginx demo
  - backendRefs:
    - name: nginx
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /apps/nginx
  # hello-world demo
  - backendRefs:
    - name: hello-world
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /apps/hello
---
# ReferenceGrant: allows the Envoy Gateway controller to reference
# the deploy-dashboard Service in the apps namespace
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-envoy-gateway
  namespace: apps
  labels:
    app.kubernetes.io/name: deploy-dashboard
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: envoy-gateway-system
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: envoy-gateway-system
  to:
  - group: ""
    kind: Service
    name: deploy-dashboard
  - group: ""
    kind: Service
    name: echo-server
  - group: ""
    kind: Service
    name: nginx
  - group: ""
    kind: Service
    name: hello-world
---
# ConfigMap: contains the base64-encoded HTML for the dashboard
# (generated by: base64 -w0 web/index.html)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-html
  namespace: apps
data:
  index.html.b64: ""
