# Example demo workloads for the dashboard to display and manage.
# All in the "apps" namespace alongside the dashboard.

# ── jmalloc/echo-server: simple HTTP echo server ──────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: apps
  labels:
    app: echo-server
  annotations:
    workload-url: "/apps/echo"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
      - name: echo
        image: jmalloc/echo-server:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: MESSAGE
          value: "Hello from the echo-server demo!"
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: apps
  labels:
    app: echo-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: echo-server
---
# ── nginx: a classic web server ───────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: apps
  labels:
    app: nginx
  annotations:
    workload-url: "/apps/nginx"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: apps
  labels:
    app: nginx
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: nginx
---
# ── hello-world: a simple multi-container demo ────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: apps
  labels:
    app: hello-world
  annotations:
    workload-url: "/apps/hello"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
      - name: hello
        image: busybox:latest
        command: ["sh", "-c"]
        args:
        - |
          echo "Hello from the hello-world container!"
          while true; do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') heartbeat"
            sleep 5
          done
      - name: sidecar
        image: busybox:latest
        command: ["sh", "-c"]
        args:
        - |
          echo "Sidecar container started."
          while true; do
            echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') sidecar-alive"
            sleep 10
          done
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: apps
  labels:
    app: hello-world
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: hello-world
