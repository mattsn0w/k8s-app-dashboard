# Example demo workloads for the dashboard to display and manage.
# All in the "apps" namespace alongside the dashboard.

# ── jmalloc/echo-server: simple HTTP echo server ──────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-server
  namespace: apps
  labels:
    app: echo-server
  annotations:
    workload-url: "/apps/echo"
    workload-icon: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: echo-server
  template:
    metadata:
      labels:
        app: echo-server
    spec:
      containers:
      - name: echo
        image: jmalloc/echo-server:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: MESSAGE
          value: "Hello from the echo-server demo!"
---
apiVersion: v1
kind: Service
metadata:
  name: echo-server
  namespace: apps
  labels:
    app: echo-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: echo-server
---
# ── ttyd terminal ─────────────────────────────────────────────
# ttyd is a single static C binary: PTY + WebSocket + self-contained xterm.js.
# The -b flag sets the base-path so ttyd natively serves at /apps/terminal/
# (page), /apps/terminal/ws (WebSocket), /apps/terminal/token (auth token).
# No gateway URLRewrite is needed — the PathPrefix match routes directly.
# For per-user instances, set -b to the user's subpath (e.g. /u/user1/terminal).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttyd-terminal
  namespace: apps
  labels:
    app: ttyd-terminal
  annotations:
    workload-url: "/apps/terminal"
    workload-icon: terminal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ttyd-terminal
  template:
    metadata:
      labels:
        app: ttyd-terminal
    spec:
      containers:
      - name: terminal
        image: registry.co.slakin.net/local/ttyd-web:latest
        args:
        - "-W"
        - "-p"
        - "7681"
        - "-b"
        - "/apps/terminal"
        - "bash"
        ports:
        - containerPort: 7681
          name: http
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /apps/terminal/token
            port: 7681
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /apps/terminal/token
            port: 7681
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ttyd-terminal
  namespace: apps
  labels:
    app: ttyd-terminal
spec:
  type: ClusterIP
  ports:
  - port: 7681
    targetPort: 7681
    protocol: TCP
    name: http
  selector:
    app: ttyd-terminal
---
# ── VS Code Web ───────────────────────────────────────────────
# A third demo workload to demonstrate the workload-url + workload-icon
# feature. "VS Code Web" is the community web build of Visual Studio Code.
# workload-icon: "vscode" refers to the Primer Octicon `vscode`.
# workload-url: "apps/vscode/" is a relative subpath (subpath-aware SPA).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vscode-web
  namespace: apps
  labels:
    app: vscode-web
  annotations:
    # Absolute path: the SPA opens this directly (not relative to /app/), so it
    # resolves to /apps/vscode/ regardless of the SPA's own subpath.
    workload-url: "/apps/vscode/"
    workload-icon: vscode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vscode-web
  template:
    metadata:
      labels:
        app: vscode-web
    spec:
      containers:
      - name: vscode
        image: codercom/code-server:latest
        # Auth is disabled (--auth none, empty PASSWORD) because the upstream
        # Envoy Gateway enforces OIDC. The browser is already authenticated by
        # the gateway before it reaches code-server, so code-server should not
        # show its own login screen.
        args: ["--auth", "none", "--bind-addr", "0.0.0.0:8080"]
        env:
        - name: PASSWORD
          value: ""
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "50m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: vscode-web
  namespace: apps
  labels:
    app: vscode-web
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: vscode-web
